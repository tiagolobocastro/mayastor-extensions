name: Release Artifacts
on:
  push:
    branches:
      - 'release/**'
  workflow_call:
    inputs:
      tag:
        description: 'Tag to build, example: v2.9.0'
        required: true
        type: string

jobs:
  kubectl-plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
